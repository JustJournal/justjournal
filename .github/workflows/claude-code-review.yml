name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: number
      focus:
        description: "Optional focus area (e.g. 'security', 'correctness', 'Makefile conventions')"
        required: false
        type: string
        default: ""

# A new push to a PR supersedes any review still running on the old head.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Claude Code Review (automatic)
        if: github.event_name == 'pull_request'
        uses: anthropics/claude-code-action@v1
        with:
          track_progress: true
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            You are reviewing a pull request for Just Journal, a Java-based blogging website.

            Review the diff for:
            1. Correctness — Java best practices, current syntax for Java 21, well-formed JavaScript and HTML
            2. Security — no embedded credentials, safe fetch URLs, no command injection in scripts.
            3. Compatibility — do not break backward compatibility with API endpoints and work with the fediverse/mastodon instances

            Post inline comments on specific lines where issues are found. Summarize overall verdict at the end.

      - name: Claude Code Review (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: anthropics/claude-code-action@v1
        with:
          track_progress: true
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.inputs.pr_number }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            You are reviewing a pull request for Just Journal, a java based blogging website.
            ${{ github.event.inputs.focus != '' && format('Focus especially on: {0}', github.event.inputs.focus) || '' }}

            Review the diff for:
            1. Correctness — Java best practices, current syntax for Java 21, well-formed JavaScript and HTML
            2. Security — no embedded credentials, safe fetch URLs, no command injection in scripts.
            3. Compatibility — do not break backward compatibility with API endpoints and work with the fediverse/mastodon instances

            Post inline comments on specific lines where issues are found. Summarize the overall verdict at the end.
