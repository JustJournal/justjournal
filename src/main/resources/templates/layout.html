    <meta name="viewport" content="width=device-width"/>
    <meta http-equiv="content-language" content="en-us"/>

    <link rel="stylesheet" href="/static/styles/bootstrap.min.css" th:href="@{/static/styles/bootstrap.min.css}"/>
    <link rel="stylesheet" href="/static/styles/main.css" th:href="@{/static/styles/main.css}"/>
    <link rel="stylesheet" href="/static/components/Font-Awesome/css/all.css" th:href="@{/components/Font-Awesome/css/all.css}"/>

<body th:attr="data-page=${pageId},data-authenticated-username=${authenticatedUsername},data-profile-username=${profileUsername},data-entry-id=${entryId},data-comment-id=${commentId}">
<header>
    <div id="header">
        <h1><a href="/"><img src="/static/images/jj_header.gif" th:src="@{/images/jj_header.gif}" alt="JustJournal" width="608"/></a></h1>
    </div>
</header>

<div class="container" th:replace="~{${contentTemplate} :: content}">
    <p>Loading…</p>
</div>

<footer>
    <div id="footer">
        <p id="copyright">&#169; 2003 - 2025 Lucas Holt. All rights reserved.</p>
        <p><a href="/privacy" title="Privacy Policy">Privacy</a> |
            <a href="/search" title="Search">Search</a> |
            <a href="/sitemap" title="Sitemap">Sitemap</a></p>
    </div>
</footer>

<script type="text/javascript" src="/static/components/jquery/dist/jquery.min.js" th:src="@{/components/jquery/dist/jquery.min.js}"></script>

<script type="text/javascript" src="/static/ckeditor/ckeditor.js" th:src="@{/ckeditor/ckeditor.js}"></script>
<script type="text/javascript" src="/static/ckeditor/plugins/markdown/js/to-markdown.js" th:src="@{/ckeditor/plugins/markdown/js/to-markdown.js}"></script>
