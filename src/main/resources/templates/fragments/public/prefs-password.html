<div th:fragment="content" class="container">
    <div class="row">
        <div class="col-md-12">
            <h2>Preferences</h2>
            <form id="frmPasswd" role="form" class="form-horizontal">
                <fieldset>
                    <legend><strong>Change Account Password</strong><br/></legend>
                    <div class="form-group">
                        <label for="passCurrent" class="col-sm-2 control-label">Current Password</label>
                        <div class="col-sm-4">
                            <input type="password" name="passCurrent" id="passCurrent" size="15" class="form-control input-sm" maxlength="50" placeholder="Password" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="passNew" class="col-sm-2 control-label">New Password</label>
                        <div class="col-sm-4">
                            <input type="password" name="passNew" id="passNew" size="15" class="form-control input-sm" minlength="8" maxlength="50" placeholder="Password" required>
                            <span class="help-block">8 to 50 characters: letters, numbers, spaces and <code>_ @ . ! &amp; * # $ ? ^</code></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="col-sm-offset-2 col-sm-10">
                            <button class="btn btn-primary btn-md" type="submit">Save</button>
                        </div>
                    </div>
                </fieldset>
            </form>
            <div class="alert alert-danger" id="password-error" style="display:none;"></div>
            <div class="alert alert-success" id="password-success" style="display:none;"></div>
        </div>
    </div>
</div>
