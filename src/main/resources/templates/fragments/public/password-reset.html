<div th:fragment="content" class="container">
    <div class="row">
        <div class="col-md-12">
            <form id="frmResetPassword" role="form" class="form-horizontal">
                <fieldset>
                    <legend><strong>Choose a New Password</strong></legend>
                    <div class="form-group">
                        <label for="reset-password" class="col-sm-2 control-label">New Password</label>
                        <div class="col-sm-4">
                            <input type="password" name="password" id="reset-password" maxlength="50" class="form-control input-sm" placeholder="Password" autocomplete="new-password" required autofocus>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="reset-password2" class="col-sm-2 control-label">New Password (again)</label>
                        <div class="col-sm-4">
                            <input type="password" name="password2" id="reset-password2" maxlength="50" class="form-control input-sm" placeholder="Password" autocomplete="new-password" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="col-sm-offset-2 col-sm-10">
                            <button class="btn btn-primary btn-md" type="submit">Save</button>
                        </div>
                    </div>
                </fieldset>
            </form>
            <div class="alert alert-danger" id="reset-error" style="display:none;"></div>
            <div class="alert alert-success" id="reset-success" style="display:none;"></div>
        </div>
    </div>
</div>
