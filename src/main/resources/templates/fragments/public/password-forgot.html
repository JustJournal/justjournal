<div th:fragment="content" class="container">
    <div class="row">
        <div class="col-md-12">
            <form id="frmForgotPassword" role="form" class="form-horizontal">
                <fieldset>
                    <legend><strong>Forgot Password</strong></legend>
                    <p>Enter your username and the e-mail address on your account. If they match, we'll e-mail you a link to choose a new password.</p>
                    <div class="form-group">
                        <label for="forgot-username" class="col-sm-2 control-label">Username</label>
                        <div class="col-sm-4">
                            <input type="text" name="username" id="forgot-username" maxlength="50" class="form-control input-sm" placeholder="Username" autocomplete="username" required autofocus>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="forgot-email" class="col-sm-2 control-label">E-mail</label>
                        <div class="col-sm-4">
                            <input type="email" name="email" id="forgot-email" maxlength="100" class="form-control input-sm" placeholder="E-mail" autocomplete="email" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="col-sm-offset-2 col-sm-10">
                            <button class="btn btn-primary btn-md" type="submit">Send Reset Link</button>
                        </div>
                    </div>
                </fieldset>
            </form>
            <div class="alert alert-danger" id="forgot-error" style="display:none;"></div>
            <div class="alert alert-success" id="forgot-success" style="display:none;"></div>
        </div>
    </div>
</div>
