<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title th:text="${title} ? ${title} + ' - JustJournal Admin' : 'JustJournal Admin'">JustJournal Admin</title>
    <meta name="viewport" content="width=device-width"/>
    <meta name="robots" content="noindex, nofollow"/>
    <link rel="stylesheet" href="/static/styles/bootstrap.min.css" th:href="@{/static/styles/bootstrap.min.css}"/>
</head>
<body>
<nav class="navbar navbar-default">
    <div class="container">
        <div class="navbar-header">
            <a class="navbar-brand" href="/admin" th:href="@{/admin}">JustJournal Admin</a>
        </div>
        <th:block th:if="${adminLoggedIn}">
            <ul class="nav navbar-nav">
                <li th:classappend="${adminSection == 'images'} ? 'active'"><a href="/admin/images" th:href="@{/admin/images}">Pictures</a></li>
                <li th:classappend="${adminSection == 'settings'} ? 'active'"><a href="/admin/settings" th:href="@{/admin/settings}">Settings</a></li>
                <li th:classappend="${adminSection == 'users'} ? 'active'"><a href="/admin/users" th:href="@{/admin/users}">Accounts</a></li>
            </ul>
            <form class="navbar-form navbar-right" method="post" action="/admin/logout" th:action="@{/admin/logout}">
                <input type="hidden" name="_csrf" th:value="${csrfToken}"/>
                <button type="submit" class="btn btn-default">Log out</button>
            </form>
        </th:block>
    </div>
</nav>

<div class="container">
    <div class="alert alert-success" th:if="${message}" th:text="${message}" role="status"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}" role="alert"></div>
    <div th:replace="~{${contentTemplate} :: content}">
        <p>Loading…</p>
    </div>
</div>
</body>
</html>
