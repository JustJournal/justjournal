spring:
  profiles.default: default
---
spring:
  config:
    activate:
      on-profile: default
  application:
    name: justjournal
  main:
    allow-bean-definition-overriding: true
  jmx:
    enabled: true
  flyway:
    baseline-on-migrate: true
    table: schema_version
  jackson:
    serialization:
      write-dates-as-timestamps: false
  elasticsearch:
    enabled: true
    uris: http://127.0.0.1:9200
  datasource:
    url: jdbc:mysql://localhost:3306/jj
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: jj
    password: 
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 30
      minimum-idle: 2
      idle-timeout: 14400
      max-lifetime: 30000
      connection-timeout: 30000
      pool-name: JJHikariCP
      connection-test-query: SELECT 1
  jpa:
    database: MYSQL
    hibernate:
      ddl-auto: none
    generate-ddl: false
    show-sql: false
    properties:
     physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
     hibernate:
       temp:
         use_jdbc_metadata_defaults: false
     jakarta:
       persistence:
         sharedCache:
           mode: ALL
  servlet:
      multipart:
        max-file-size: 20MB
        max-request-size: 21MB
  cache:
    type: redis
  web:
    resources:
      static-locations: classpath:/static/
  data:
    redis:
      # jedis (for bucket4j) brings in commons-pool2, which would otherwise switch lettuce to pooling
      lettuce:
        pool:
          enabled: false
      port: 6379
      host: localhost

server:
  port: ${port:8200}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  servlet:
    session:
      tracking-modes: cookie
  forward-headers-strategy: native
  tomcat:
    remoteip:

app:
  minio:
    host: http://ds9.midnightbsd.org:9000/
    accessKey:
    secretKey:

bucket:
  avatar: jjavatar
  image: jjimages

# Uploaded pictures and avatars are checked for nudity by a vision model on Ollama before they are
# stored. Nudity and sexual content are refused. REVIEW keeps the picture but shows it only to its
# owner until its moderation_status is set to APPROVED. The model is asked on each server in turn.
moderation:
  enabled: true
  ollama:
    urls: http://192.168.1.206:11434,http://192.168.1.206:11435
    # llama3.2-vision does not load on these servers (unknown architecture mllama); gemma4 does
    model: gemma4:latest
    timeout-seconds: 90
  # a sexually suggestive picture with no nudity: APPROVED, REVIEW or REJECTED
  on-suggestive: REVIEW
  # when no server answers or the answer makes no sense: APPROVED, REVIEW or REJECTED
  on-error: REVIEW
  # an animated GIF the model found safe, having seen only its first frame: APPROVED, REVIEW or REJECTED
  on-animated: REVIEW

bing:
  indexNowKey:

# Per client IP limits on dynamic pages, buckets kept in redis (see RateLimitConfig).
# Measured Oct 2026: 99.9% of IPs peak under 53 requests/10s and 277/10min.
bucket4j:
  enabled: true
  cache-to-use: redis-jedis
  filters:
    - id: pages
      cache-name: buckets
      filter-method: servlet
      filter-order: 1
      url: '^(?!/(static|components|js|ckeditor|images|styles|software|Avatar|AlbumImage|favicon\.ico|robots\.txt)).*'
      metrics:
        tags:
          - key: IP
            expression: getRemoteAddr()
            types: REJECTED_COUNTER
          - key: URL
            expression: getRequestURI()
      rate-limits:
        - cache-key: "getRemoteAddr()"
          bandwidths:
            - id: burst
              capacity: 50
              time: 10
              unit: seconds
            - id: sustained
              capacity: 300
              time: 10
              unit: minutes

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
  info:
    git:
      mode: full

