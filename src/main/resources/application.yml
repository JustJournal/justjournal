spring:
  profiles.default: default
---
spring:
  config:
    activate:
      on-profile: default
  application:
    name: justjournal
  main:
    allow-bean-definition-overriding: true
  jmx:
    enabled: true
  flyway:
    baseline-on-migrate: true
    table: schema_version
  jackson:
    serialization:
      write-dates-as-timestamps: false
  elasticsearch:
    enabled: true
    uris: http://127.0.0.1:9200
  datasource:
    url: jdbc:mysql://localhost:3306/jj
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: jj
    password: 
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 30
      minimum-idle: 2
      idle-timeout: 14400
      max-lifetime: 30000
      connection-timeout: 30000
      pool-name: JJHikariCP
      connection-test-query: SELECT 1
  jpa:
    database: MYSQL
    hibernate:
      ddl-auto: none
    generate-ddl: false
    show-sql: false
    properties:
     physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
     hibernate:
       temp:
         use_jdbc_metadata_defaults: false
     jakarta:
       persistence:
         sharedCache:
           mode: ALL
  servlet:
      multipart:
        max-file-size: 20MB
        max-request-size: 21MB
  cache:
    type: redis
  web:
    resources:
      static-locations: classpath:/static/
  data:
    redis:
      # jedis (for bucket4j) brings in commons-pool2, which would otherwise switch lettuce to pooling
      lettuce:
        pool:
          enabled: false
      port: 6379
      host: localhost

server:
  port: ${port:8200}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  servlet:
    session:
      tracking-modes: cookie
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # the header carrying the client address (Tomcat's own default); internal-proxies keeps
      # Spring Boot's default of the private and loopback ranges unless a deployment overrides it
      remote-ip-header: X-Forwarded-For

app:
  minio:
    host: http://ds9.midnightbsd.org:9000/
    accessKey:
    secretKey:

bucket:
  avatar: jjavatar
  image: jjimages

# Uploaded pictures and avatars are checked for nudity by a vision model on Ollama before they are
# stored. Nudity and sexual content are refused. REVIEW keeps the picture but shows it only to its
# owner until its moderation_status is set to APPROVED. The model is asked on each server in turn.
moderation:
  enabled: true
  ollama:
    urls: http://192.168.1.206:11434,http://192.168.1.206:11435
    # a vision model that answers structured (JSON schema) output; requests rotate across the
    # servers above, so it must be pulled on every one of them
    model: qwen3-vl:8b
    timeout-seconds: 90
  # a sexually suggestive picture with no nudity: APPROVED, REVIEW or REJECTED
  on-suggestive: REVIEW
  # when no server answers or the answer makes no sense: APPROVED, REVIEW or REJECTED
  on-error: REVIEW
  # an animated GIF the model found safe, having seen only its first frame: APPROVED, REVIEW or REJECTED
  on-animated: REVIEW

# A post can have one picture and one link attached. Pictures go through the content filter above;
# a picture uploaded but never saved with a post is removed after orphan-hours.
entry-attachments:
  image:
    display-size: 1024
    max-pending-per-user: 10
    orphan-hours: 24

# Links attached to posts are checked when the post is saved: http/https on the usual ports only,
# no URL shorteners, nothing on blocked-domains (a domain blocks its subdomains too), every address
# the name resolves to must be public, and the reputation lists below must not list it.
link-safety:
  blocked-domains: []
  extra-shorteners: []
  # whether a reputation list that can't be asked refuses the link
  fail-closed: false
  dns-timeout-ms: 3000
  cache-minutes: 30
  # Spamhaus refuses queries sent through public resolvers such as 8.8.8.8; they come back as
  # "unknown". Use a local recursive resolver, or a DQS key zone such as <key>.dbl.dq.spamhaus.net
  dbl:
    enabled: true
    zone: dbl.spamhaus.org
    timeout-ms: 2000
  # Google Safe Browsing v4 Lookup API; off without a key
  safe-browsing:
    api-key: ${SAFE_BROWSING_API_KEY:}
    client-id: justjournal
    timeout-ms: 3000

# A background job fetches each new link's page for its title, description and picture.
link-preview:
  enabled: true
  batch-size: 10
  max-attempts: 3
  max-redirects: 5
  connect-timeout-ms: 5000
  read-timeout-ms: 10000
  max-download-ms: 20000
  max-html-bytes: 1048576
  max-image-bytes: 10485760
  max-image-pixels: 40000000
  image-size: 600
  user-agent: "JustJournal link preview (+https://www.justjournal.com/)"

# ActivityPub federation: people on Mastodon and other fediverse servers may follow the journals of
# writers who turned it on, and get their public entries. While this is off nothing is sent to
# other servers and the setting is hidden from writers.
activitypub:
  federation:
    enabled: false
  # A background job posts queued activities to other servers' inboxes: https only, public
  # addresses only, no redirects. Temporary failures are retried for about two days.
  delivery:
    # plain http inboxes, for testing only; private addresses are refused either way
    allow-http: false
    batch-size: 20
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
    max-request-ms: 30000
    keep-delivered-days: 7
    keep-failed-days: 30
    # deleting an account posts an actor Delete to each follower's server straight away, since the
    # key that signs it goes with the account; this is how long the request waits for all of them
    account-delete-seconds: 30
    user-agent: "JustJournal (+https://www.justjournal.com/)"

bing:
  indexNowKey:

# Per client IP limits on dynamic pages, buckets kept in redis (see RateLimitConfig).
# Measured Oct 2026: 99.9% of IPs peak under 53 requests/10s and 277/10min.
bucket4j:
  enabled: true
  cache-to-use: redis-jedis
  filters:
    - id: pages
      cache-name: buckets
      filter-method: servlet
      filter-order: 1
      url: '^(?!/(static|components|js|ckeditor|images|styles|software|Avatar|AlbumImage|EntryImage|EntryLinkImage|favicon\.ico|robots\.txt)).*'
      metrics:
        tags:
          - key: IP
            expression: getRemoteAddr()
            types: REJECTED_COUNTER
          - key: URL
            expression: getRequestURI()
      rate-limits:
        - cache-key: "getRemoteAddr()"
          bandwidths:
            - id: burst
              capacity: 50
              time: 10
              unit: seconds
            - id: sustained
              capacity: 300
              time: 10
              unit: minutes
    # saving a post can check a link against DNS and reputation lists, and uploading a post picture
    # asks the content filter; both cost far more than a page view
    - id: attachments
      cache-name: buckets
      filter-method: servlet
      filter-order: 2
      url: '^/(EntryImage|api/entry)/?$'
      rate-limits:
        - cache-key: "getRemoteAddr()"
          execute-predicates:
            - METHOD=POST,PUT
          bandwidths:
            - id: burst
              capacity: 5
              time: 1
              unit: minutes
            - id: sustained
              capacity: 30
              time: 1
              unit: hours

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
  info:
    git:
      mode: full

